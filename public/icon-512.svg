<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="marsil-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#marsil-grad)" />
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" transform="translate(64, 64) scale(0.75)">
    <!-- Truck Cabin & Body -->
    <path d="M 40 220 L 40 100 A 20 20 0 0 1 60 80 L 320 80 A 20 20 0 0 1 340 100 L 340 320 L 40 320 Z" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" />
    <path d="M 340 160 L 430 160 A 20 20 0 0 1 446 172 L 472 230 A 20 20 0 0 1 475 240 L 475 320 L 340 320" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" />
    <!-- Wheels -->
    <circle cx="120" cy="340" r="48" fill="#1e293b" stroke="#ffffff" stroke-width="24" />
    <circle cx="120" cy="340" r="16" fill="#60a5fa" />
    <circle cx="390" cy="340" r="48" fill="#1e293b" stroke="#ffffff" stroke-width="24" />
    <circle cx="390" cy="340" r="16" fill="#60a5fa" />
    <!-- Speed Lines / Pulse -->
    <path d="M 90 140 L 290 140" stroke="#93c5fd" stroke-width="20" stroke-dasharray="24 16" />
    <path d="M 90 200 L 260 200" stroke="#93c5fd" stroke-width="20" stroke-dasharray="20 16" />
    <path d="M 90 260 L 220 260" stroke="#93c5fd" stroke-width="20" stroke-dasharray="16 16" />
  </g>
</svg>
